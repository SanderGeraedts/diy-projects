# G-0011: every green PR that isn't a draft merges itself, through the harness's reusable
# workflow. Keep the tag the same as the harness dependency in package.json (D-0030).
#
# GitHub runs workflow_run workflows from the default branch, so a PR can't change how its
# own merge is decided.
name: Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write # to start backend.yml after a merge

jobs:
  merge:
    uses: SanderGeraedts/harness/.github/workflows/auto-merge.yml@v0.1.0
    with:
      # A merge made with GITHUB_TOKEN starts no push workflows, so backend.yml wouldn't
      # publish the PocketBase image. These are the paths its push trigger watches.
      backend-workflow: backend.yml
      backend-paths: '^(deploy/nas/(Dockerfile|pb_migrations/|pb_hooks/|smoke-test\.sh)|\.github/workflows/backend\.yml)'
