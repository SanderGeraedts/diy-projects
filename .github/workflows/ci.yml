# D-0017: every PR runs the checks; the auto-merge workflow acts on the result.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # D-0019: pnpm, at the version in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # No CONTEXT here, so this is a "local" build: seeded data, no PocketBase address (D-0006).
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      # Screenshot baselines (T-0002): committed ones are compared; missing ones are written
      # and uploaded as the screenshot-baselines artifact, to commit under e2e/.
      - run: pnpm run test:e2e --update-snapshots=missing
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: e2e/**/*-snapshots/**
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # T-0015 and T-0016: sign-in and sync against a throwaway PocketBase built from deploy/nas
  # (its migrations and hooks), on an empty database (D-0006: never the NAS). The
  # *.pocketbase.test.ts files are skipped elsewhere.
  pocketbase-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POCKETBASE_TEST_URL: http://127.0.0.1:8090
      POCKETBASE_TEST_SUPERUSER_EMAIL: admin@ci.invalid
      POCKETBASE_TEST_SUPERUSER_PASSWORD: ci-only-password-123456
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build PocketBase
        run: docker build -t pb-test deploy/nas
      - name: Start on an empty database
        # As .github/workflows/backend.yml does, with the NAS's command line.
        run: |
          docker run -d --name pb -p 127.0.0.1:8090:8090 pb-test serve --http=0.0.0.0:8090 \
            --dir=/pb_data --migrationsDir=/pb_migrations --hooksDir=/pb_hooks \
            --automigrate=false --origins=https://projects.sanderg.nl
          for i in $(seq 1 30); do
            if curl -fsS "$POCKETBASE_TEST_URL/api/health"; then echo; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' pb)" != "true" ]; then
              echo "PocketBase exited"; exit 1
            fi
            sleep 1
          done
          curl -fsS "$POCKETBASE_TEST_URL/api/health" >/dev/null
      - name: Create the superuser
        # The CLI, as deploy/nas/smoke-test.sh does; the test makes its users through it.
        run: docker exec pb pocketbase superuser upsert "$POCKETBASE_TEST_SUPERUSER_EMAIL" "$POCKETBASE_TEST_SUPERUSER_PASSWORD" --dir=/pb_data
      - name: Sign-in tests
        run: pnpm exec vitest run --reporter=verbose src/auth/auth.pocketbase.test.ts
      - name: Sync tests
        # Two simulated devices (two Dexie databases, two clients) against the same PocketBase.
        run: pnpm exec vitest run --reporter=verbose src/sync/sync.pocketbase.test.ts
      - name: PocketBase logs
        if: always()
        run: docker logs pb || true
