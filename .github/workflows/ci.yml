# D-0017: every PR runs the checks; the auto-merge workflow acts on the result.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # D-0019: pnpm, at the version in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # No CONTEXT here, so this is a "local" build: seeded data, no PocketBase address (D-0006).
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      # Screenshot baselines (T-0002): committed ones are compared; missing ones are written
      # and uploaded as the screenshot-baselines artifact, to commit under e2e/.
      - run: pnpm run test:e2e --update-snapshots=missing
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: e2e/**/*-snapshots/**
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
