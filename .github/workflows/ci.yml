# Every PR runs the checks; the auto-merge workflow acts on the result (G-0011).
# Keep the tag the same as the harness dependency in package.json (D-0030).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The auto-merge workflow starts CI on main after a merge: a merge made with GITHUB_TOKEN
  # starts no push workflows (harness 0.2.0).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The harness's reusable CI: pnpm install, harness check, then the checks below. GitHub
  # reports this job as "checks / checks", the name the ruleset on main requires.
  checks:
    uses: SanderGeraedts/harness/.github/workflows/ci.yml@v0.9.0
    with:
      # No CONTEXT here, so this is a "local" build: seeded data, no PocketBase address
      # (G-0019).
      checks: |
        pnpm run typecheck
        pnpm test
        pnpm run build
      # Screenshot baselines (T-0002): committed ones are compared; missing ones are written
      # and uploaded in the ci-artifacts artifact, to commit under e2e/.
      e2e: pnpm run test:e2e --update-snapshots=missing
      artifacts: |
        e2e/**/*-snapshots/**
        playwright-report/

  # T-0015 and T-0016: sign-in and sync against a throwaway PocketBase built from deploy/nas
  # (its migrations and hooks), on an empty database (G-0019: never the NAS). The
  # *.pocketbase.test.ts files are skipped elsewhere.
  pocketbase-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POCKETBASE_TEST_URL: http://127.0.0.1:8090
      POCKETBASE_TEST_SUPERUSER_EMAIL: admin@ci.invalid
      POCKETBASE_TEST_SUPERUSER_PASSWORD: ci-only-password-123456
      # Any test origin will do; production sets its own (APP_ORIGIN, deploy/nas/README.md).
      APP_ORIGIN: https://app.example
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build PocketBase
        run: docker build -t pb-test deploy/nas
      - name: Start on an empty database
        # As .github/workflows/backend.yml does, with the NAS's command line.
        run: |
          docker run -d --name pb -p 127.0.0.1:8090:8090 pb-test serve --http=0.0.0.0:8090 \
            --dir=/pb_data --migrationsDir=/pb_migrations --hooksDir=/pb_hooks \
            --automigrate=false --origins="$APP_ORIGIN"
          for i in $(seq 1 30); do
            if curl -fsS "$POCKETBASE_TEST_URL/api/health"; then echo; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' pb)" != "true" ]; then
              echo "PocketBase exited"; exit 1
            fi
            sleep 1
          done
          curl -fsS "$POCKETBASE_TEST_URL/api/health" >/dev/null
      - name: Create the superuser
        # The CLI, as deploy/nas/smoke-test.sh does; the test makes its users through it.
        run: docker exec pb pocketbase superuser upsert "$POCKETBASE_TEST_SUPERUSER_EMAIL" "$POCKETBASE_TEST_SUPERUSER_PASSWORD" --dir=/pb_data
      - name: Sign-in tests
        run: pnpm exec vitest run --reporter=verbose src/auth/auth.pocketbase.test.ts
      - name: Sync tests
        # Two simulated devices (two Dexie databases, two clients) against the same PocketBase.
        run: pnpm exec vitest run --reporter=verbose src/sync/sync.pocketbase.test.ts
      - name: Photo file tests
        # T-0017: uploads that resume byte for byte, the original dropped only after all three
        # files are confirmed, a second device with copy and thumbnail only, no upload after a delete.
        run: pnpm exec vitest run --reporter=verbose src/sync/photos.pocketbase.test.ts
      - name: PocketBase logs
        if: always()
        run: docker logs pb || true
