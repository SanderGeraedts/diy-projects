# T-0013: check the PocketBase image on an empty database, smoke-test it, publish on main.
# See docs/deploy/pocketbase-on-the-nas.md section 3. This is the only place the migrations
# and hooks run before production: there is no Docker on the development machines.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "deploy/nas/Dockerfile"
      - "deploy/nas/pb_migrations/**"
      - "deploy/nas/pb_hooks/**"
      - "deploy/nas/smoke-test.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "deploy/nas/Dockerfile"
      - "deploy/nas/pb_migrations/**"
      - "deploy/nas/pb_hooks/**"
      - "deploy/nas/smoke-test.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# One publish at a time, in push order.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/sandergeraedts/diy-projects-pocketbase
      # Any test origin will do; production sets its own (APP_ORIGIN, deploy/nas/README.md).
      # deploy/nas/smoke-test.sh checks CORS against the same variable.
      APP_ORIGIN: https://app.example
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t pb-test deploy/nas

      - name: Start on an empty database
        # The NAS's command line (docs/deploy/pocketbase-on-the-nas.md, 1), except --http.
        # A migration that throws makes PocketBase exit: stop waiting as soon as it has.
        run: |
          docker run -d --name pb -p 127.0.0.1:8090:8090 pb-test serve --http=0.0.0.0:8090 \
            --dir=/pb_data --migrationsDir=/pb_migrations --hooksDir=/pb_hooks \
            --automigrate=false --origins="$APP_ORIGIN"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health; then echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' pb)" != "true" ]; then
              echo "PocketBase exited"; exit 1
            fi
            sleep 1
          done
          echo "PocketBase not healthy after 30 s"; exit 1

      - name: Smoke test
        run: bash deploy/nas/smoke-test.sh

      - name: PocketBase logs
        if: always()
        run: docker logs pb || true

      - name: Publish
        # Only on main, never on a pull request.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHA=sha-${GITHUB_SHA::7}
          docker tag pb-test "$IMAGE:$SHA"
          docker tag pb-test "$IMAGE:stable"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:stable"
          echo "Published \`$IMAGE:$SHA\` and \`$IMAGE:stable\`" >> "$GITHUB_STEP_SUMMARY"
