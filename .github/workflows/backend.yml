# T-0013: check the PocketBase image on an empty database, smoke-test it, publish on main.
# See docs/deploy/pocketbase-on-the-nas.md section 3. Draft: not yet run.
name: backend

on:
  push:
    branches: [main]
    paths: ["deploy/nas/Dockerfile", "deploy/nas/pb_migrations/**", "deploy/nas/pb_hooks/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["deploy/nas/Dockerfile", "deploy/nas/pb_migrations/**", "deploy/nas/pb_hooks/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/sandergeraedts/diy-projects-pocketbase
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t pb-test deploy/nas
      - name: Start on an empty database
        run: |
          docker run -d --name pb -p 8090:8090 pb-test serve --http=0.0.0.0:8090 --dir=/pb_data \
            --migrationsDir=/pb_migrations --hooksDir=/pb_hooks --automigrate=false \
            --origins=https://projects.sanderg.nl
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' pb)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs pb; exit 1
      - name: Smoke test
        # TODO(T-0013): create a superuser and two users, write and update a project, assert a
        # history row, a stranger sees an empty list, history unreadable by a user, and no
        # CORS header for another origin.
        run: |
          curl -fsS -H 'Origin: https://projects.sanderg.nl' -i http://127.0.0.1:8090/api/health | grep -i '^access-control-allow-origin: https://projects.sanderg.nl'
          ! curl -fsS -H 'Origin: https://evil.example' -i http://127.0.0.1:8090/api/health | grep -i '^access-control-allow-origin'
      - name: Logs on failure
        if: failure()
        run: docker logs pb
      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHA=sha-${GITHUB_SHA::7}
          docker tag pb-test "$IMAGE:$SHA"; docker tag pb-test "$IMAGE:stable"
          docker push "$IMAGE:$SHA"; docker push "$IMAGE:stable"
          echo "Published $IMAGE:$SHA and :stable" >> "$GITHUB_STEP_SUMMARY"
